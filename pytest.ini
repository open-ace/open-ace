[pytest]
testpaths = tests
python_files = test_*.py e2e_*.py *_test.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --import-mode=importlib
asyncio_mode = auto
filterwarnings =
    ignore::DeprecationWarning
    ignore:record_property is incompatible with junit_family:pytest.PytestWarning

# Test markers for different test types
markers =
    unit: Unit tests (fast, no external dependencies)
    ui: UI tests using Playwright
    integration: Tests that cross process, database, filesystem, or service boundaries
    security: Tests that preserve or validate a security invariant
    regression: Tests that preserve behavior fixed for a previously reported defect
    priority_p0: Critical functionality that must run on every PR and before releases
    priority_p1: Important functionality covered by scheduled extended tests
    priority_p2: Broad or expensive coverage covered by periodic/manual runs
    issue(number): Link a test to a GitHub issue (use --issue=N to select it)
    postgres: Requires a live PostgreSQL server (auto-skipped via pg_db fixture when unreachable)
    performance: Wall-clock timing benchmarks (deselected from the required test matrix; run in the performance-test CI job)

# Exclude scripts/ and server-dependent tests from default collection.
# All HTTP/Playwright E2E tests live under tests/e2e/ (Issue #238); the single
# tests/e2e entry keeps new test dirs from being silently collected by CI.
# tests/issues is a legacy quarantine. New regression tests belong in their
# execution-layer directory and use the regression/issue markers instead.
norecursedirs = scripts .qwen tests/issues tests/e2e
