# Open ACE - Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-ace
  namespace: open-ace
  labels:
    app.kubernetes.io/name: open-ace
    app.kubernetes.io/component: web
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: open-ace
      app.kubernetes.io/component: web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "19888"
        prometheus.io/path: "/metrics"
      labels:
        app.kubernetes.io/name: open-ace
        app.kubernetes.io/component: web
    spec:
      serviceAccountName: open-ace
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: open-ace
          image: open-ace:latest
          imagePullPolicy: Always
          # HA Support (Issue #1851): preStop hook for graceful terminal relay handoff
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 30"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: http
              containerPort: 19888
              protocol: TCP
          envFrom:
            - configMapRef:
                name: open-ace-config
            - secretRef:
                name: open-ace-secrets
          env:
            - name: SCHEDULER_MODE
              value: "web"
            # #3237: must match the scheduler deployment exactly, or the two
            # roles operate on different directories.
            - name: OPENACE_AGENT_STATE_ROOT
              value: "/var/lib/openace/agent-state"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: HOME
              value: /home/open-ace
            - name: OPENACE_CONFIG_DIR
              value: /home/open-ace/.open-ace
            # Prometheus multi-worker mode (Issue #2186)
            - name: PROMETHEUS_MULTIPROC_DIR
              value: /tmp/prometheus_multiproc
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 10
            failureThreshold: 3
          # Startup probe for slow initialization (Issue #2186)
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 0
            periodSeconds: 5
            timeoutSeconds: 10
            failureThreshold: 60  # 300s max startup time
          volumeMounts:
            - name: data
              mountPath: /workspace
              subPath: workspace
            - name: logs
              mountPath: /app/logs
            - name: tmp
              mountPath: /tmp
            - name: agent-tasks
              mountPath: /run/openace-agent-tasks
            # #3237: carried CLI transcripts. MUST be the same storage the
            # scheduler sees — this pod runs the stop/delete/override routes
            # that purge the state, while the scheduler pod is what writes it.
            # On the per-pod emptyDir above, those purges deleted an unrelated
            # empty directory and the real transcripts were retained forever.
            - name: agent-state
              mountPath: /var/lib/openace/agent-state
              subPath: agent-state
            - name: config
              mountPath: /home/open-ace/.open-ace
              subPath: config
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: open-ace-data
        - name: logs
          emptyDir: {}
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        - name: agent-tasks
          emptyDir: {}
        # Same RWX claim as `data`, distinct subPath. RWX is already required
        # by this deployment (see k8s/storage.yaml), so this adds no new
        # storage requirement — only a shared location.
        - name: agent-state
          persistentVolumeClaim:
            claimName: open-ace-data
        - name: config
          persistentVolumeClaim:
            claimName: open-ace-data
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: open-ace
                topologyKey: kubernetes.io/hostname
      tolerations:
        - key: "node-role.kubernetes.io/master"
          operator: "Exists"
          effect: "NoSchedule"

---
# Open ACE - HorizontalPodAutoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: open-ace
  namespace: open-ace
  labels:
    app.kubernetes.io/name: open-ace
    app.kubernetes.io/component: web
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: open-ace
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
