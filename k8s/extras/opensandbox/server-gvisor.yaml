# Snapshot metadata must survive a restart (upstream: `memory` is deliberately
# not the default "because server-managed snapshot resources must survive
# process restarts"). An emptyDir would silently lose it on every roll.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: opensandbox-store-gvisor
  namespace: open-ace
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi

---
# OpenSandbox server for the gvisor isolation tier (Issue #2023).
#
# One Deployment per tier, because the secure runtime is a SERVER-level setting
# upstream — "All sandboxes on that server transparently use the configured
# runtime". The backend config routes a tenant to this endpoint by tier; a tier
# with no endpoint raises rather than falling back to a weaker one.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opensandbox-gvisor
  namespace: open-ace
  labels:
    app.kubernetes.io/name: opensandbox
    app.kubernetes.io/component: gvisor
spec:
  # ONE active server process. Upstream: "Run only one active server process
  # against a PostgreSQL database", and the SQLite store below is per-pod — two
  # replicas would each keep their own snapshot metadata and disagree.
  replicas: 1
  strategy:
    # The store PVC is ReadWriteOnce; a rolling update would deadlock waiting
    # for the outgoing pod to release it.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: opensandbox
      app.kubernetes.io/component: gvisor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opensandbox
        app.kubernetes.io/component: gvisor
    spec:
      serviceAccountName: opensandbox-server
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        # Required for the store PVC. A freshly provisioned CSI volume mounts
        # root:root 0755, and without fsGroup the kubelet performs no ownership
        # change — so UID 1000 cannot create the SQLite file and the server dies
        # at the same import-time point the store fix exists to prevent. Every
        # other PVC-mounting manifest in this repo sets it (k8s/deployment.yaml).
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: opensandbox/server:latest
          args: ["--config", "/etc/opensandbox/sandbox.toml"]
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            # The API key the control plane presents. sandbox-backends.json
            # references it by env-var NAME only; the value never appears there.
            - name: OPENSANDBOX_SERVER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: opensandbox-keys
                  key: gvisor-api-key
            # Must be non-empty. execd's auth middleware SHORT-CIRCUITS on an
            # empty token, leaving execd reachable with no credential at all —
            # which is what the execd_token_required attestation asserts against.
            - name: EXECD_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: opensandbox-keys
                  key: gvisor-execd-token
            # Gateway-mode SIGNED-URL keys. The server builds
            # [ingress.secure_access] from these at startup, keeping key material
            # out of the ConfigMap; the ingress gateway verifies what the server
            # signs, so the two must share them.
            #
            # Format is strict: <key_id>=<base64>, key_id exactly one character
            # in [0-9a-z], and the active key must be one of those ids. A bare
            # hex string fails config validation and the server never starts.
            #
            # NOT what the peer-isolation guarantee rests on: the opaque
            # per-sandbox OpenSandbox-Secure-Access token needs only
            # `[ingress] mode = "gateway"`.
            - name: OPENSANDBOX_SECURE_ACCESS_KEYS
              valueFrom:
                secretKeyRef:
                  name: opensandbox-keys
                  key: gvisor-secure-access-keys
            - name: OPENSANDBOX_SECURE_ACCESS_ACTIVE_KEY
              valueFrom:
                secretKeyRef:
                  name: opensandbox-keys
                  key: gvisor-secure-access-active-key
          volumeMounts:
            - name: config
              mountPath: /etc/opensandbox
              readOnly: true
            # The BatchSandbox template referenced by
            # [kubernetes] batchsandbox_template_file. Mounted separately so the
            # path in sandbox.toml and the path on disk cannot drift.
            - name: sandbox-template
              mountPath: /etc/opensandbox/templates
              readOnly: true
            - name: store
              mountPath: /var/lib/opensandbox
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /health
              port: http
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
      volumes:
        - name: config
          configMap:
            name: opensandbox-config-gvisor
        - name: sandbox-template
          configMap:
            name: opensandbox-sandbox-template
        - name: store
          persistentVolumeClaim:
            claimName: opensandbox-store-gvisor
        - name: tmp
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: opensandbox
  namespace: open-ace
spec:
  selector:
    app.kubernetes.io/name: opensandbox
    app.kubernetes.io/component: gvisor
  ports:
    - name: http
      port: 8080
      targetPort: http
