# GitHub API paths whitelist configuration
# Version: 1.0.0
# Issue: #2650
#
# This file defines allowed gh api paths.
# Format: path patterns with * as single-segment wildcard.

version: 1

allowed_paths:
  # User endpoints
  - "user"

  # Repository endpoints (owner/repo format)
  - "repos/*/*"

  # Pull request endpoints
  - "repos/*/*/pulls/*"
  - "repos/*/*/pulls/*/comments"
  - "repos/*/*/pulls/*/reviews"

  # Issue endpoints
  - "repos/*/*/issues/*"
  - "repos/*/*/issues/*/comments"

forbidden_methods:
  - "DELETE"
  - "PUT"
  - "PATCH"
