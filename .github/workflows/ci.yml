name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  # Re-triggered by the Lint Heal workflow (.github/workflows/lint-heal.yml)
  # when approving the parked runs for a healed head was not possible
  # (GITHUB_TOKEN pushes fire no CI events; dispatch does). healed_sha marks a
  # dispatch as heal-originated: PR Gate stamps only for PR runs or dispatches
  # carrying it, so a routine manual dispatch (empty input) cannot re-stamp a
  # green gate over a red run. The field is an origin breadcrumb, not an
  # attestation — it is not checked against the run's head SHA, so a
  # collaborator dispatching with an arbitrary value still re-stamps; that is
  # the same trust level as their ordinary push rights, not a new capability.
  workflow_dispatch:
    inputs:
      healed_sha:
        description: 'Head SHA of a Lint Heal push (set automatically; manual dispatches must leave it empty)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select suites
    runs-on: ubuntu-24.04
    outputs:
      compatibility_smoke: ${{ steps.select.outputs.compatibility_smoke }}
      critical_e2e: ${{ steps.select.outputs.critical_e2e }}
      default_collection: ${{ steps.select.outputs.default_collection }}
      dependency_audit: ${{ steps.select.outputs.dependency_audit }}
      e2e_governance: ${{ steps.select.outputs.e2e_governance }}
      frontend: ${{ steps.select.outputs.frontend }}
      issue_collection: ${{ steps.select.outputs.issue_collection }}
      legacy_pr: ${{ steps.select.outputs.legacy_pr }}
      package: ${{ steps.select.outputs.package }}
      postgres: ${{ steps.select.outputs.postgres }}
      python_core: ${{ steps.select.outputs.python_core }}
      selected: ${{ steps.select.outputs.selected }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: false

      - name: Select suites from changed paths
        id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || 'origin/main' }}
        run: python scripts/ci.py detect --base "$BASE_SHA" --github-output

      - name: Publish selection summary
        run: 'echo "Selected suites: ${{ steps.select.outputs.selected || ''policy-only'' }}" >> "$GITHUB_STEP_SUMMARY"'

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ci.lock

      - name: Install lint dependencies
        run: pip install -c requirements-ci.lock bandit[toml] pre-commit

      - name: Run Bandit security check
        if: "!contains(github.event.pull_request.labels.*.name, 'skip-security-check')"
        run: python scripts/lint/bandit_check.py --baseline scripts/lint/bandit_baseline.json

      - name: Run API Security Scanner
        if: "!contains(github.event.pull_request.labels.*.name, 'skip-security-check')"
        run: python scripts/lint/api_security_scanner.py

      - name: Validate security baseline metadata
        if: "!contains(github.event.pull_request.labels.*.name, 'skip-security-check')"
        run: python scripts/lint/validate_baseline_metadata.py

      - name: Security check bypassed warning
        if: contains(github.event.pull_request.labels.*.name, 'skip-security-check')
        run: echo "::warning::Security checks bypassed with skip-security-check label"

      - name: Run pre-commit
        env:
          # Bandit has its own baseline-aware step above.
          SKIP: bandit-check,no-commit-to-branch
        run: pre-commit run --all-files

  test:
    name: test (${{ matrix.python-version }})
    needs: changes
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.10'
            suite: compatibility-smoke
          - python-version: '3.11'
            suite: python-core
          # Transitional compatibility context required by the current ruleset.
          # Remove after branch protection requires the stable PR Gate context.
          - python-version: '3.12'
            suite: compatibility-smoke
          - python-version: '3.14'
            suite: compatibility-smoke
    steps:
      # eval P1-1: each lane is a REQUIRED check, so it must always report (green)
      # to satisfy the branch ruleset. When the suite was not selected for this
      # change set the real steps below are skipped, which historically left the
      # lane green with no visible reason -- a "was this actually tested?" gap that
      # was only discoverable in the raw step logs. Make that honest and visible:
      # emit a run-summary annotation and a job-summary line naming the skipped
      # lane. (A truly SKIPPED badge instead of green would require de-matrixing
      # into per-version jobs; that is deliberately out of scope for this change.)
      - name: Explain skipped lane
        if: >-
          (matrix.suite == 'python-core' && needs.changes.outputs.python_core != 'true') ||
          (matrix.suite == 'compatibility-smoke' && needs.changes.outputs.compatibility_smoke != 'true')
        run: |
          MSG="Lane not needed: ${{ matrix.suite }} was not selected for this change set (no matching paths changed)."
          echo "::notice title=Lane not needed::${MSG}"
          echo "**${{ matrix.suite }} lane skipped** — ${MSG}" >> "$GITHUB_STEP_SUMMARY"
          echo "${MSG}"

      - uses: actions/checkout@v6
        if: >-
          (matrix.suite == 'python-core' && needs.changes.outputs.python_core == 'true') ||
          (matrix.suite == 'compatibility-smoke' && needs.changes.outputs.compatibility_smoke == 'true')
        with:
          submodules: false

      - name: Set up Python ${{ matrix.python-version }}
        if: >-
          (matrix.suite == 'python-core' && needs.changes.outputs.python_core == 'true') ||
          (matrix.suite == 'compatibility-smoke' && needs.changes.outputs.compatibility_smoke == 'true')
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-ci.lock

      - name: Install test dependencies
        if: >-
          (matrix.suite == 'python-core' && needs.changes.outputs.python_core == 'true') ||
          (matrix.suite == 'compatibility-smoke' && needs.changes.outputs.compatibility_smoke == 'true')
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.lock

      - name: Validate default collection baseline
        if: matrix.suite == 'python-core' && needs.changes.outputs.default_collection == 'true'
        run: python scripts/ci.py run default-collection

      - name: Validate legacy issue collection baseline
        if: matrix.suite == 'python-core' && needs.changes.outputs.issue_collection == 'true'
        run: python scripts/ci.py run issue-collection

      - name: Validate E2E governance artifacts
        if: matrix.suite == 'python-core' && needs.changes.outputs.e2e_governance == 'true'
        run: python scripts/ci.py run e2e-governance

      - name: Run promoted legacy regressions
        if: matrix.suite == 'python-core' && needs.changes.outputs.legacy_pr == 'true'
        run: python scripts/ci.py run legacy-pr

      - name: Run selected test suite
        if: >-
          (matrix.suite == 'python-core' && needs.changes.outputs.python_core == 'true') ||
          (matrix.suite == 'compatibility-smoke' && needs.changes.outputs.compatibility_smoke == 'true')
        run: python scripts/ci.py run ${{ matrix.suite }}

      - name: Upload coverage to Codecov
        if: matrix.suite == 'python-core' && needs.changes.outputs.python_core == 'true'
        continue-on-error: true
        timeout-minutes: 2
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Run frontend suite
        run: python3 scripts/ci.py run frontend
      - name: Upload frontend coverage
        if: always()
        continue-on-error: true
        uses: codecov/codecov-action@v6
        with:
          files: ./frontend/coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  build:
    needs: [lint, test]
    if: always() && needs.lint.result == 'success' && needs.test.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ci.lock
      - name: Install build frontend
        run: pip install -c requirements-ci.lock build
      - name: Build packages through the shared runner
        run: python scripts/ci.py run package
      - uses: actions/upload-artifact@v7
        with:
          name: dist-packages
          path: dist/

  postgres-test:
    name: PostgreSQL integration
    needs: changes
    if: >-
      needs.changes.outputs.postgres == 'true' &&
      !contains(github.event.pull_request.labels.*.name, 'skip-extended-tests')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ace
          POSTGRES_PASSWORD: ace
          POSTGRES_DB: ace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ace -d ace_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ci.lock
      - name: Install test dependencies
        run: |
          pip install -r requirements-ci.lock
      - name: Run PostgreSQL suite
        env:
          DATABASE_URL: postgresql://ace:ace@localhost:5432/ace_test
          ACE_DATABASE_NAME: ace_test
        run: python scripts/ci.py run postgres

  critical-e2e:
    # Advisory, and honestly so (eval P1-1). This job is deliberately NOT in the
    # PR Gate's `needs`, so its result never blocks a PR merge -- E2E gates
    # releases, not PRs. It intentionally does NOT set `continue-on-error`: a
    # failure now surfaces as an honest red check (informational) rather than a
    # masked green one. The previous `continue-on-error: true` + absence from the
    # gate double-neutered it into a hidden fail-open.
    name: Critical E2E (advisory, non-blocking)
    needs: changes
    if: >-
      needs.changes.outputs.critical_e2e == 'true' &&
      !contains(github.event.pull_request.labels.*.name, 'skip-extended-tests')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Keep the installed browser outside the isolated HOME used by the tests.
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
    steps:
      - name: Advisory notice
        run: >-
          echo "::notice title=Critical E2E is advisory::This suite does NOT gate
          PR merge (it gates releases). A red result here is informational, not a
          merge blocker."
      - uses: actions/checkout@v6
        with:
          submodules: false
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: npm ci --no-audit --no-fund && npm run build
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ci.lock
      - name: Install E2E dependencies
        run: |
          pip install -r requirements-ci.lock
          playwright install chromium --with-deps
      - name: Run critical E2E suite
        env:
          HEADLESS: true
        run: python scripts/ci.py run critical-e2e
      - name: Upload E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: critical-e2e
          path: |
            test-results/
            screenshots/
          if-no-files-found: ignore
          retention-days: 14

  security-gate:
    name: Dependency security audit
    needs: changes
    if: >-
      needs.changes.outputs.dependency_audit == 'true' &&
      !contains(github.event.pull_request.labels.*.name, 'skip-security-check')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ci.lock
      - name: Install Python auditor
        run: pip install -c requirements-ci.lock pip-audit
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Audit production dependencies through the shared runner
        env:
          npm_config_registry: https://registry.npmjs.org
        run: python scripts/ci.py run dependency-audit

  pr-gate:
    name: PR Gate
    # On workflow_dispatch ONLY when the Lint Heal workflow dispatched it
    # (healed_sha set): a heal-originated re-run is the sole run at the healed
    # SHA, so its PR Gate is the legitimate latest context. A manual dispatch
    # without healed_sha runs the jobs but stamps no PR Gate — otherwise any
    # collaborator could re-stamp a green gate over a red pull_request run at
    # the same ref.
    if: >-
      always() &&
      (
        github.event_name == 'pull_request' ||
        (github.event_name == 'workflow_dispatch' && inputs.healed_sha != '')
      )
    needs: [changes, lint, test, frontend, build, postgres-test, security-gate]
    runs-on: ubuntu-24.04
    steps:
      - name: Validate required and selected lanes
        env:
          CHANGES: ${{ needs.changes.result }}
          LINT: ${{ needs.lint.result }}
          TEST: ${{ needs.test.result }}
          FRONTEND: ${{ needs.frontend.result }}
          BUILD: ${{ needs.build.result }}
          POSTGRES: ${{ needs.postgres-test.result }}
          SECURITY: ${{ needs.security-gate.result }}
        run: |
          python - <<'PY'
          import os
          required = {name: os.environ[name] for name in ("CHANGES", "LINT", "TEST", "BUILD")}
          selected = {name: os.environ[name] for name in ("FRONTEND", "POSTGRES", "SECURITY")}
          failures = {name: result for name, result in required.items() if result != "success"}
          failures.update(
              {name: result for name, result in selected.items() if result not in {"success", "skipped"}}
          )
          if failures:
              raise SystemExit(f"PR gate failed: {failures}")
          print("PR gate passed", {**required, **selected})
          PY

  docker:
    needs: [lint, test, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: open-ace:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
