name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  # Re-triggered by the lint-autofix job after it pushes formatter fixes back
  # to a PR branch (GITHUB_TOKEN pushes fire no CI events; dispatch does).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select suites
    runs-on: ubuntu-24.04
    outputs:
      compatibility_smoke: ${{ steps.select.outputs.compatibility_smoke }}
      critical_e2e: ${{ steps.select.outputs.critical_e2e }}
      default_collection: ${{ steps.select.outputs.default_collection }}
      dependency_audit: ${{ steps.select.outputs.dependency_audit }}
      frontend: ${{ steps.select.outputs.frontend }}
      issue_collection: ${{ steps.select.outputs.issue_collection }}
      legacy_pr: ${{ steps.select.outputs.legacy_pr }}
      package: ${{ steps.select.outputs.package }}
      postgres: ${{ steps.select.outputs.postgres }}
      python_core: ${{ steps.select.outputs.python_core }}
      selected: ${{ steps.select.outputs.selected }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: false

      - name: Select suites from changed paths
        id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || 'origin/main' }}
        run: python scripts/ci.py detect --base "$BASE_SHA" --github-output

      - name: Publish selection summary
        run: 'echo "Selected suites: ${{ steps.select.outputs.selected || ''policy-only'' }}" >> "$GITHUB_STEP_SUMMARY"'

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ci.lock

      - name: Install lint dependencies
        run: pip install -c requirements-ci.lock bandit[toml] pre-commit

      - name: Run Bandit security check
        if: "!contains(github.event.pull_request.labels.*.name, 'skip-security-check')"
        run: python scripts/lint/bandit_check.py --baseline scripts/lint/bandit_baseline.json

      - name: Run API Security Scanner
        if: "!contains(github.event.pull_request.labels.*.name, 'skip-security-check')"
        run: python scripts/lint/api_security_scanner.py

      - name: Validate security baseline metadata
        if: "!contains(github.event.pull_request.labels.*.name, 'skip-security-check')"
        run: python scripts/lint/validate_baseline_metadata.py

      - name: Security check bypassed warning
        if: contains(github.event.pull_request.labels.*.name, 'skip-security-check')
        run: echo "::warning::Security checks bypassed with skip-security-check label"

      - name: Run pre-commit
        env:
          # Bandit has its own baseline-aware step above.
          SKIP: bandit-check,no-commit-to-branch
        run: pre-commit run --all-files

  lint-autofix:
    name: Lint auto-heal (push formatter fixes back)
    needs: lint
    # always() is required: without it the default skip-on-failed-dependency
    # rule skips this job precisely when it should run.
    if: >-
      always() &&
      needs.lint.result == 'failure' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          submodules: false

      - name: Loop guard — do not heal twice in a row
        id: guard
        run: |
          if [[ "$(git log -1 --pretty=%s)" == "style: auto-format"* ]]; then
            echo "Head commit is already an auto-format fix; the remaining lint failure is not formatter-fixable."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ci.lock

      - name: Install pre-commit
        if: steps.guard.outputs.skip != 'true'
        run: pip install -c requirements-ci.lock pre-commit

      - name: Apply formatter autofixes
        if: steps.guard.outputs.skip != 'true'
        id: autofix
        run: |
          # Only the hooks that can fix files. The dispatched CI re-run is the
          # authoritative full-suite check; skipping mypy/pydocstyle keeps this
          # job fast and hard to fail for unrelated reasons.
          rc=0
          for hook in black isort ruff trailing-whitespace end-of-file-fixer; do
            pre-commit run "$hook" --all-files || rc=1
          done
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push fixes and re-trigger CI
        if: steps.guard.outputs.skip != 'true' && steps.autofix.outputs.changed == 'true'
        env:
          BRANCH: ${{ github.head_ref }}
          GH_TOKEN: ${{ github.token }}
          FIX_RC: ${{ steps.autofix.outputs.rc }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "style: auto-format (pre-commit autofixes for #${{ github.event.pull_request.number }})"
          # Plain non-force push: if the branch moved meanwhile, this fails and
          # the newer push's own CI run takes over.
          if ! git push origin "HEAD:$BRANCH"; then
            echo "::warning::Branch $BRANCH moved during the heal; skipping re-trigger."
            exit 0
          fi
          NEW_SHA="$(git rev-parse HEAD)"
          # A GITHUB_TOKEN push parks the pull_request runs for the new head in
          # action_required (anti-recursion). Approving them replays the normal
          # PR pipeline at the fixed head; if none show up or approval fails,
          # fall back to workflow_dispatch.
          approved=0
          for attempt in 1 2 3 4 5 6; do
            sleep 10
            RUN_IDS="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${NEW_SHA}&status=action_required" \
              --jq '.workflow_runs[].id' 2>/dev/null || true)"
            if [ -n "$RUN_IDS" ]; then break; fi
            echo "waiting for parked runs at ${NEW_SHA:0:8} (attempt $attempt)"
          done
          for run_id in $RUN_IDS; do
            if gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/approve" --method POST >/dev/null 2>&1; then
              approved=$((approved + 1))
              echo "Approved parked run $run_id"
            else
              echo "::warning::Could not approve parked run $run_id"
            fi
          done
          if [ "$approved" -eq 0 ]; then
            echo "No parked runs approved; falling back to workflow_dispatch."
            gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/dispatches" \
              --method POST -f "ref=$BRANCH"
            echo "Re-triggered CI on $BRANCH via workflow_dispatch"
          fi
          if [ "$FIX_RC" != "0" ]; then
            echo "::warning::Autofixes applied, but formatters still reported unfixable findings (rc=$FIX_RC)."
          fi

      - name: Nothing fixable
        if: steps.guard.outputs.skip != 'true' && steps.autofix.outputs.changed == 'false'
        env:
          FIX_RC: ${{ steps.autofix.outputs.rc }}
        run: |
          if [ "$FIX_RC" != "0" ]; then
            echo "::warning::Formatter hooks ran but produced no diff while reporting findings (rc=$FIX_RC) — not auto-fixable. See the lint job log."
          else
            echo "::warning::Lint failed but formatter autofixes produced no diff — the failure is not formatter-related. See the lint job log."
          fi

  test:
    name: test (${{ matrix.python-version }})
    needs: changes
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.10'
            suite: compatibility-smoke
          - python-version: '3.11'
            suite: python-core
          # Transitional compatibility context required by the current ruleset.
          # Remove after branch protection requires the stable PR Gate context.
          - python-version: '3.12'
            suite: compatibility-smoke
          - python-version: '3.14'
            suite: compatibility-smoke
    steps:
      - name: Explain skipped lane
        if: >-
          (matrix.suite == 'python-core' && needs.changes.outputs.python_core != 'true') ||
          (matrix.suite == 'compatibility-smoke' && needs.changes.outputs.compatibility_smoke != 'true')
        run: echo "${{ matrix.suite }} is not needed for this change set"

      - uses: actions/checkout@v6
        if: >-
          (matrix.suite == 'python-core' && needs.changes.outputs.python_core == 'true') ||
          (matrix.suite == 'compatibility-smoke' && needs.changes.outputs.compatibility_smoke == 'true')
        with:
          submodules: false

      - name: Set up Python ${{ matrix.python-version }}
        if: >-
          (matrix.suite == 'python-core' && needs.changes.outputs.python_core == 'true') ||
          (matrix.suite == 'compatibility-smoke' && needs.changes.outputs.compatibility_smoke == 'true')
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-ci.lock

      - name: Install test dependencies
        if: >-
          (matrix.suite == 'python-core' && needs.changes.outputs.python_core == 'true') ||
          (matrix.suite == 'compatibility-smoke' && needs.changes.outputs.compatibility_smoke == 'true')
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.lock

      - name: Validate default collection baseline
        if: matrix.suite == 'python-core' && needs.changes.outputs.default_collection == 'true'
        run: python scripts/ci.py run default-collection

      - name: Validate legacy issue collection baseline
        if: matrix.suite == 'python-core' && needs.changes.outputs.issue_collection == 'true'
        run: python scripts/ci.py run issue-collection

      - name: Run promoted legacy regressions
        if: matrix.suite == 'python-core' && needs.changes.outputs.legacy_pr == 'true'
        run: python scripts/ci.py run legacy-pr

      - name: Run selected test suite
        if: >-
          (matrix.suite == 'python-core' && needs.changes.outputs.python_core == 'true') ||
          (matrix.suite == 'compatibility-smoke' && needs.changes.outputs.compatibility_smoke == 'true')
        run: python scripts/ci.py run ${{ matrix.suite }}

      - name: Upload coverage to Codecov
        if: matrix.suite == 'python-core' && needs.changes.outputs.python_core == 'true'
        continue-on-error: true
        timeout-minutes: 2
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Run frontend suite
        run: python3 scripts/ci.py run frontend
      - name: Upload frontend coverage
        if: always()
        continue-on-error: true
        uses: codecov/codecov-action@v6
        with:
          files: ./frontend/coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  build:
    needs: [lint, test]
    if: always() && needs.lint.result == 'success' && needs.test.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ci.lock
      - name: Install build frontend
        run: pip install -c requirements-ci.lock build
      - name: Build packages through the shared runner
        run: python scripts/ci.py run package
      - uses: actions/upload-artifact@v7
        with:
          name: dist-packages
          path: dist/

  postgres-test:
    name: PostgreSQL integration
    needs: changes
    if: >-
      needs.changes.outputs.postgres == 'true' &&
      !contains(github.event.pull_request.labels.*.name, 'skip-extended-tests')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ace
          POSTGRES_PASSWORD: ace
          POSTGRES_DB: ace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ace -d ace_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ci.lock
      - name: Install test dependencies
        run: |
          pip install -r requirements-ci.lock
      - name: Run PostgreSQL suite
        env:
          DATABASE_URL: postgresql://ace:ace@localhost:5432/ace_test
          ACE_DATABASE_NAME: ace_test
        run: python scripts/ci.py run postgres

  critical-e2e:
    name: Critical E2E (advisory)
    needs: changes
    if: >-
      needs.changes.outputs.critical_e2e == 'true' &&
      !contains(github.event.pull_request.labels.*.name, 'skip-extended-tests')
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Keep the installed browser outside the isolated HOME used by the tests.
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: npm ci --no-audit --no-fund && npm run build
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ci.lock
      - name: Install E2E dependencies
        run: |
          pip install -r requirements-ci.lock
          playwright install chromium --with-deps
      - name: Run critical E2E suite
        env:
          HEADLESS: true
        run: python scripts/ci.py run critical-e2e
      - name: Upload E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: critical-e2e
          path: |
            test-results/
            screenshots/
          if-no-files-found: ignore
          retention-days: 14

  security-gate:
    name: Dependency security audit
    needs: changes
    if: >-
      needs.changes.outputs.dependency_audit == 'true' &&
      !contains(github.event.pull_request.labels.*.name, 'skip-security-check')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ci.lock
      - name: Install Python auditor
        run: pip install -c requirements-ci.lock pip-audit
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Audit production dependencies through the shared runner
        env:
          npm_config_registry: https://registry.npmjs.org
        run: python scripts/ci.py run dependency-audit

  pr-gate:
    name: PR Gate
    # Also on workflow_dispatch: the lint-autofix re-trigger runs on
    # workflow_dispatch, and its checks become the PR head's latest set —
    # without this, a required PR Gate context would never appear on it.
    if: always() && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
    needs: [changes, lint, test, frontend, build, postgres-test, security-gate]
    runs-on: ubuntu-24.04
    steps:
      - name: Validate required and selected lanes
        env:
          CHANGES: ${{ needs.changes.result }}
          LINT: ${{ needs.lint.result }}
          TEST: ${{ needs.test.result }}
          FRONTEND: ${{ needs.frontend.result }}
          BUILD: ${{ needs.build.result }}
          POSTGRES: ${{ needs.postgres-test.result }}
          SECURITY: ${{ needs.security-gate.result }}
        run: |
          python - <<'PY'
          import os
          required = {name: os.environ[name] for name in ("CHANGES", "LINT", "TEST", "BUILD")}
          selected = {name: os.environ[name] for name in ("FRONTEND", "POSTGRES", "SECURITY")}
          failures = {name: result for name, result in required.items() if result != "success"}
          failures.update(
              {name: result for name, result in selected.items() if result not in {"success", "skipped"}}
          )
          if failures:
              raise SystemExit(f"PR gate failed: {failures}")
          print("PR gate passed", {**required, **selected})
          PY

  docker:
    needs: [lint, test, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: open-ace:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
