name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to rebuild/republish, e.g. v2.0.0"
        required: true

# PyPI uses Trusted Publishing (OIDC), not an API token: the pypi-publish job
# runs only when the repository variable PYPI_PUBLISH is "true", and PyPI must
# list this repo + workflow (release.yml) + environment (pypi) as a trusted
# publisher for the open-ace-server project ("open-ace" is too similar to the
# unrelated "openace" project for PyPI to accept).

permissions:
  contents: write

jobs:
  pre-release-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ github.event.release.tag_name || inputs.tag }}
        submodules: false

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Build frontend
      working-directory: frontend
      run: |
        npm ci
        npm run build

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: requirements-ci.lock

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-ci.lock
        playwright install chromium --with-deps

    - name: Run critical release regression tests
      run: |
        python scripts/run_extended_tests.py \
          --category critical \
          --isolated-home \
          --reruns 1 \
          --timeout 180 \
          --maxfail 5 \
          --junitxml test-results/release-critical.xml
      env:
        CI: true
        HEADLESS: true

    - name: Upload release test report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: release-critical-extended-tests
        path: |
          test-results/
          screenshots/
        if-no-files-found: ignore
        retention-days: 30

  build-and-publish:
    runs-on: ubuntu-latest
    needs: [pre-release-tests]
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ env.RELEASE_TAG }}
        submodules: false

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Build package
      run: |
        python -m pip install --upgrade pip
        pip install -c requirements-ci.lock build
        python -m build --sdist --wheel --outdir dist/

    - name: Keep distributions for PyPI
      uses: actions/upload-artifact@v7
      with:
        name: python-dist
        path: dist/
        retention-days: 7

    - name: Upload release assets
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ env.RELEASE_TAG }}
        files: dist/*

  pypi-publish:
    # Separate job so only it gets an OIDC token, and a PyPI failure can never
    # block the GitHub Release assets above.
    runs-on: ubuntu-latest
    needs: [build-and-publish]
    if: vars.PYPI_PUBLISH == 'true'
    environment:
      name: pypi
      url: https://pypi.org/project/open-ace-server/
    permissions:
      id-token: write
    steps:
    - uses: actions/download-artifact@v7
      with:
        name: python-dist
        path: dist/

    - name: Publish to PyPI (Trusted Publishing)
      uses: pypa/gh-action-pypi-publish@release/v1
