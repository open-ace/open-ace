name: Extended Tests

on:
  pull_request:
    branches: [main, master]
    types: [opened, synchronize, reopened, labeled]
  schedule:
    # Nightly full coverage; expensive cross-browser/performance checks are weekly.
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      category:
        description: 'Test category to run'
        required: true
        default: 'critical'
        type: choice
        options:
          - critical
          - regression
          - e2e
          - issues
          - all
          - specific
      issue_numbers:
        description: 'Comma-separated issue numbers for category=issues'
        required: false
        default: ''
      target:
        description: 'Specific pytest target for category=specific'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: extended-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  critical-pr:
    name: Critical PR E2E
    # Main CI selects this lane by changed paths. This explicit label is an
    # escape hatch for changes outside those paths.
    if: >-
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'run-critical-e2e') &&
      !contains(github.event.pull_request.labels.*.name, 'skip-extended-tests')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ci.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.lock
          playwright install chromium --with-deps

      - name: Run critical extended tests
        run: python scripts/ci.py run critical-e2e
        env:
          CI: true
          HEADLESS: true

      - name: Upload critical test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: critical-pr-extended-tests
          path: |
            test-results/
            screenshots/
          if-no-files-found: ignore
          retention-days: 14

  nightly-python:
    name: Nightly Python ${{ matrix.python-version }}
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.14']
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-ci.lock
      - name: Install test dependencies
        run: pip install -r requirements-ci.lock
      - name: Run full deterministic and collection gates
        run: |
          mkdir -p test-results
          python scripts/ci.py run default-collection issue-collection python-core \
            2>&1 | tee "test-results/nightly-python-${{ matrix.python-version }}.log"
      - name: Upload nightly Python log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-python-${{ matrix.python-version }}
          path: test-results/
          if-no-files-found: error
          retention-days: 14

  full-e2e:
    name: Full E2E
    if: |
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && (inputs.category == 'e2e' || inputs.category == 'all')) ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'run-full-e2e'))
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ci.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.lock
          playwright install chromium --with-deps

      - name: Run full E2E tests
        run: |
          # Issue #2189: Validate collection before running
          python scripts/run_extended_tests.py \
            --category e2e \
            --dry-run 2>&1 | grep -E "Collected|Total files" || true

          python scripts/run_extended_tests.py \
            --category e2e \
            --isolated-home \
            --reruns 1 \
            --timeout 240 \
            --junitxml test-results/full-e2e.xml
        env:
          CI: true
          HEADLESS: true

      - name: Upload full E2E report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: full-e2e
          path: |
            test-results/
            screenshots/
          if-no-files-found: ignore
          retention-days: 14

  issue-tests:
    name: Issue Tests (${{ matrix.group }}/4)
    if: |
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && (inputs.category == 'issues' || inputs.category == 'all')) ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'run-issue-tests'))
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ci.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.lock
          playwright install chromium --with-deps

      - name: Run issue regression shard
        # Known legacy failures make pytest exit non-zero; keep going so the
        # JUnit + exit code are uploaded. The authoritative verdict comes from
        # the legacy-issue-baseline comparator job below (handoff §4.6).
        continue-on-error: true
        run: |
          set +e
          python scripts/run_extended_tests.py \
            --category issues \
            --issue-numbers "${{ github.event.inputs.issue_numbers || '' }}" \
            --split-total 4 \
            --split-group "${{ matrix.group }}" \
            --isolated-home \
            --reruns 1 \
            --timeout 240 \
            --junitxml "test-results/issues-${{ matrix.group }}.xml"
          echo $? > "test-results/issues-${{ matrix.group }}.exit-code"
        env:
          CI: true
          HEADLESS: true

      - name: Upload issue test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: issue-tests-${{ matrix.group }}
          path: |
            test-results/
            screenshots/
          if-no-files-found: ignore
          retention-days: 14

  manual-extended:
    name: Manual Extended Tests
    if: github.event_name == 'workflow_dispatch' && inputs.category != 'issues' && inputs.category != 'all'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ci.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.lock
          playwright install chromium --with-deps

      - name: Run selected extended tests
        run: |
          if [ -n "$TARGET" ]; then
            python scripts/run_extended_tests.py \
              --category "$CATEGORY" \
              --target "$TARGET" \
              --isolated-home \
              --reruns 1 \
              --timeout 240 \
              --junitxml test-results/manual-extended.xml
          else
            python scripts/run_extended_tests.py \
              --category "$CATEGORY" \
              --isolated-home \
              --reruns 1 \
              --timeout 240 \
              --junitxml test-results/manual-extended.xml
          fi
        env:
          CATEGORY: ${{ github.event.inputs.category }}
          TARGET: ${{ github.event.inputs.target }}
          CI: true
          HEADLESS: true

      - name: Upload manual test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: manual-extended-tests
          path: |
            test-results/
            screenshots/
          if-no-files-found: ignore
          retention-days: 14

  legacy-issue-baseline:
    name: Legacy issue failure baseline
    # Authoritative gate for tests/issues known-failure debt. Runs even when a
    # shard was cancelled/timed out (it then fails closed on completeness). Runs
    # on schedule and on workflow_dispatch category=issues|all so PR branches can
    # verify against the baseline. Never runs on PRs (full execution is nightly).
    if: >-
      always() &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && (inputs.category == 'issues' || inputs.category == 'all'))) &&
      needs.issue-tests.result != 'skipped'
    needs: [issue-tests]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ci.lock
      - name: Install dependencies
        run: pip install -r requirements-ci.lock
      - name: Download all shard reports
        uses: actions/download-artifact@v7
        with:
          pattern: issue-tests-*
          merge-multiple: true
          path: artifacts
      - name: Compare against failure baseline
        run: |
          python scripts/legacy_issue_baseline.py compare \
            --baseline ci/legacy-issue-failures.json \
            --junit "artifacts/test-results/issues-*.xml" \
            --exit-code-glob "artifacts/test-results/issues-*.exit-code" \
            --test-baseline .test-baseline.json \
            --json-output test-results/legacy-issue-diff.json \
            --markdown-output test-results/legacy-issue-summary.md
      - name: Upload baseline artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: legacy-issue-baseline
          path: |
            test-results/legacy-issue-diff.json
            test-results/legacy-issue-summary.md
            artifacts/
          if-no-files-found: ignore
          retention-days: 14

  nightly-summary:
    name: Nightly Quality Gate
    if: always() && github.event_name == 'schedule'
    needs: [nightly-python, full-e2e, issue-tests, legacy-issue-baseline]
    runs-on: ubuntu-24.04
    steps:
      - name: Publish nightly result
        env:
          PYTHON_RESULT: ${{ needs.nightly-python.result }}
          E2E_RESULT: ${{ needs.full-e2e.result }}
          LEGACY_RESULT: ${{ needs.legacy-issue-baseline.result }}
        run: |
          {
            echo "## Nightly quality gate"
            echo "| Lane | Result |"
            echo "|---|---|"
            echo "| Python 3.10/3.11/3.14 | $PYTHON_RESULT |"
            echo "| Full Python E2E | $E2E_RESULT |"
            echo "| Legacy failure baseline | $LEGACY_RESULT |"
          } >> "$GITHUB_STEP_SUMMARY"
          # The legacy comparator is the authoritative issue-debt verdict;
          # issue-tests itself is non-blocking (continue-on-error transports JUnit).
          # A missing/skipped/cancelled comparator must fail the gate.
          if [ "$PYTHON_RESULT" != success ] || \
             [ "$E2E_RESULT" != success ] || \
             [ "$LEGACY_RESULT" != success ]; then
            echo "::error::A nightly quality lane failed or the baseline comparator did not run."
            exit 1
          fi
