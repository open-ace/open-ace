name: Extended Tests

on:
  pull_request:
    branches: [main, master]
    types: [opened, synchronize, reopened, labeled]
  schedule:
    # Daily at 01:18 Singapore time; expensive cross-browser/performance checks are weekly.
    - cron: '18 1 * * *'
      timezone: 'Asia/Singapore'
  workflow_dispatch:
    inputs:
      category:
        description: 'Test category to run'
        required: true
        default: 'critical'
        type: choice
        options:
          - critical
          - regression
          - e2e
          - all
          - specific
      target:
        description: 'Specific pytest target for category=specific'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: extended-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  critical-pr:
    name: Critical PR E2E
    # Main CI selects this lane by changed paths. This explicit label is an
    # escape hatch for changes outside those paths.
    if: >-
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'run-critical-e2e') &&
      !contains(github.event.pull_request.labels.*.name, 'skip-extended-tests')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ci.lock

      - name: Install dependencies
        run: |
          install_playwright_browser() {
            if timeout 10m playwright install chromium --with-deps; then
              echo "Installed Playwright Chromium with system dependencies."
              return 0
            fi

            echo "playwright install --with-deps stalled or failed; falling back to browser-only install."
            playwright install chromium
          }

          python -m pip install --upgrade pip
          pip install -r requirements-ci.lock
          install_playwright_browser

      - name: Run critical extended tests
        run: python scripts/ci.py run critical-e2e
        env:
          CI: true
          HEADLESS: true

      - name: Upload critical test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: critical-pr-extended-tests
          path: |
            test-results/
            screenshots/
          if-no-files-found: ignore
          retention-days: 14

  nightly-python:
    name: Nightly Python ${{ matrix.python-version }}
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.14']
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-ci.lock
      - name: Install test dependencies
        run: pip install -r requirements-ci.lock
      - name: Run full deterministic and collection gates
        env:
          OPENACE_CI_METRICS_FILE: test-results/nightly-ci-suite-metrics-${{ matrix.python-version }}.jsonl
        run: |
          mkdir -p test-results
          python scripts/ci.py run default-collection python-core \
            2>&1 | tee "test-results/nightly-python-${{ matrix.python-version }}.log"
      - name: Upload nightly Python log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-python-${{ matrix.python-version }}
          path: test-results/
          if-no-files-found: error
          retention-days: 14

      - name: Upload nightly CI suite metrics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-ci-suite-metrics-${{ matrix.python-version }}
          path: test-results/nightly-ci-suite-metrics-${{ matrix.python-version }}.jsonl
          if-no-files-found: error
          retention-days: 90

  full-e2e:
    name: Full E2E (${{ matrix.shard }}/2)
    if: |
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && (inputs.category == 'e2e' || inputs.category == 'all')) ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'run-full-e2e'))
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ci.lock

      - name: Install dependencies
        run: |
          install_playwright_browser() {
            if timeout 10m playwright install chromium --with-deps; then
              echo "Installed Playwright Chromium with system dependencies."
              return 0
            fi

            echo "playwright install --with-deps stalled or failed; falling back to browser-only install."
            playwright install chromium
          }

          python -m pip install --upgrade pip
          pip install -r requirements-ci.lock
          install_playwright_browser

      - name: Build nightly E2E selection
        run: |
          mkdir -p test-results
          python scripts/e2e/selector.py \
            --event nightly \
            --out test-results/full-e2e-selection.json

      - name: Run full E2E tests
        continue-on-error: true
        run: |
          set +e
          # Issue #2189: Validate collection before running
          python scripts/run_extended_tests.py \
            --category e2e \
            --selection-json test-results/full-e2e-selection.json \
            --split-total 2 \
            --split-group ${{ matrix.shard }} \
            --dry-run 2>&1 | grep -E "Collected|Total targets" || true

          python scripts/run_extended_tests.py \
            --category e2e \
            --selection-json test-results/full-e2e-selection.json \
            --split-total 2 \
            --split-group ${{ matrix.shard }} \
            --isolated-home \
            --reruns 1 \
            --timeout 240 \
            --junitxml test-results/full-e2e-${{ matrix.shard }}.xml \
            --e2e-attempts test-results/full-e2e-attempts-${{ matrix.shard }}.jsonl \
            --envelope-json test-results/full-e2e-envelope-${{ matrix.shard }}.json
          echo $? > test-results/full-e2e-${{ matrix.shard }}.exit-code
        env:
          CI: true
          HEADLESS: true

      - name: Upload full E2E report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: full-e2e-${{ matrix.shard }}
          path: |
            test-results/
            screenshots/
          if-no-files-found: ignore
          retention-days: 14

  full-e2e-governance:
    name: Full E2E Governance
    if: >-
      always() &&
      needs.full-e2e.result != 'skipped'
    needs: [full-e2e]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Download Full E2E shard 1 artifact
        uses: actions/download-artifact@v7
        with:
          name: full-e2e-1
          path: artifacts/full-e2e-1
      - name: Download Full E2E shard 2 artifact
        uses: actions/download-artifact@v7
        with:
          name: full-e2e-2
          path: artifacts/full-e2e-2
      - name: Merge Full E2E shard envelopes
        run: |
          python scripts/e2e/envelope_merge.py \
            artifacts/full-e2e-1/test-results/full-e2e-envelope-1.json \
            artifacts/full-e2e-2/test-results/full-e2e-envelope-2.json \
            --out artifacts/full-e2e-envelope.json
      - name: Validate governance ledgers
        run: |
          python scripts/e2e/governance.py validate \
            --json-output test-results/full-e2e-governance-report.json
      - name: Compare nightly selection against observed outcomes
        run: |
          python scripts/e2e/comparator.py compare \
            --selection artifacts/full-e2e-1/test-results/full-e2e-selection.json \
            --envelope artifacts/full-e2e-envelope.json \
            --json-output test-results/full-e2e-diff.json \
            --markdown-output test-results/full-e2e-summary.md \
            --governance-report test-results/full-e2e-governance-report.json
      - name: Upload governance artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: full-e2e-governance
          path: |
            test-results/full-e2e-governance-report.json
            test-results/full-e2e-diff.json
            test-results/full-e2e-summary.md
            artifacts/
          if-no-files-found: ignore
          retention-days: 14

  manual-extended:
    name: Manual Extended Tests
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.category == 'critical' ||
       inputs.category == 'regression' ||
       inputs.category == 'specific')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ci.lock

      - name: Install dependencies
        run: |
          install_playwright_browser() {
            if timeout 10m playwright install chromium --with-deps; then
              echo "Installed Playwright Chromium with system dependencies."
              return 0
            fi

            echo "playwright install --with-deps stalled or failed; falling back to browser-only install."
            playwright install chromium
          }

          python -m pip install --upgrade pip
          pip install -r requirements-ci.lock
          install_playwright_browser

      - name: Run selected extended tests
        run: |
          if [ -n "$TARGET" ]; then
            python scripts/run_extended_tests.py \
              --category "$CATEGORY" \
              --target "$TARGET" \
              --isolated-home \
              --reruns 1 \
              --timeout 240 \
              --junitxml test-results/manual-extended.xml
          else
            python scripts/run_extended_tests.py \
              --category "$CATEGORY" \
              --isolated-home \
              --reruns 1 \
              --timeout 240 \
              --junitxml test-results/manual-extended.xml
          fi
        env:
          CATEGORY: ${{ github.event.inputs.category }}
          TARGET: ${{ github.event.inputs.target }}
          CI: true
          HEADLESS: true

      - name: Upload manual test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: manual-extended-tests
          path: |
            test-results/
            screenshots/
          if-no-files-found: ignore
          retention-days: 14

  nightly-summary:
    name: Nightly Quality Gate
    if: always() && github.event_name == 'schedule'
    needs: [nightly-python, full-e2e-governance]
    runs-on: ubuntu-24.04
    steps:
      - name: Publish nightly result
        env:
          PYTHON_RESULT: ${{ needs.nightly-python.result }}
          E2E_RESULT: ${{ needs.full-e2e-governance.result }}
        run: |
          {
            echo "## Nightly quality gate"
            echo "| Lane | Result |"
            echo "|---|---|"
            echo "| Python 3.10/3.11/3.14 | $PYTHON_RESULT |"
            echo "| Full Python E2E | $E2E_RESULT |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$PYTHON_RESULT" != success ] || \
             [ "$E2E_RESULT" != success ]; then
            echo "::error::A nightly quality lane failed."
            exit 1
          fi
