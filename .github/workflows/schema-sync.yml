name: Schema Sync

on:
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/schema-sync.yml'
      - 'migrations/env.py'
      - 'migrations/baseline.py'
      - 'migrations/version_table.py'
      - 'migrations/versions/**'
      - 'schema/baselines/**'
      - 'schema/schema-postgres.sql'
      - 'schema/schema-sqlite.sql'
      - 'scripts/check_schema_sync.py'
      - 'scripts/rebuild_schema_snapshots.py'
      - 'scripts/generate_schema.py'
      - 'scripts/validate_schema.py'
      - 'scripts/shared/schema_sync.py'
  pull_request:
    branches: [main, master]
    paths:
      - '.github/workflows/schema-sync.yml'
      - 'migrations/env.py'
      - 'migrations/baseline.py'
      - 'migrations/version_table.py'
      - 'migrations/versions/**'
      - 'schema/baselines/**'
      - 'schema/schema-postgres.sql'
      - 'schema/schema-sqlite.sql'
      - 'scripts/check_schema_sync.py'
      - 'scripts/rebuild_schema_snapshots.py'
      - 'scripts/generate_schema.py'
      - 'scripts/validate_schema.py'
      - 'scripts/shared/schema_sync.py'

jobs:
  schema-sync:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ace
          POSTGRES_PASSWORD: ace
          POSTGRES_DB: ace_schema_sync
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ace -d ace_schema_sync"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Configure Git for checkout
        run: |
          # Configure Git to ignore submodule issues during checkout
          # These settings help Git skip validation of submodule entries
          git config --global submodule.ignore all
          git config --global submodule.active false
          git config --global checkout.checkStats false

      - uses: actions/checkout@v6
        with:
          submodules: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Rebuild and validate schema snapshots
        env:
          SCHEMA_SYNC_DATABASE_URL: postgresql://ace:ace@127.0.0.1:5432/ace_schema_sync
        run: |
          python scripts/rebuild_schema_snapshots.py --postgres-url "$SCHEMA_SYNC_DATABASE_URL"
          python scripts/check_schema_sync.py --postgres-url "$SCHEMA_SYNC_DATABASE_URL"
          python scripts/validate_schema.py
          git diff --exit-code -- schema/schema-postgres.sql schema/schema-sqlite.sql

      # Guard the real upgrade path: run `alembic upgrade head` end-to-end on a
      # throwaway database so a failure that only surfaces at upgrade time (e.g.
      # a revision id renamed after a DB was stamped, as in issue #2101) fails
      # the gate. The single-head check is database-free and cannot catch this.
      - name: Run alembic upgrade head on a throwaway DB
        env:
          UPGRADE_DATABASE_URL: postgresql://ace:ace@127.0.0.1:5432/ace_upgrade_check
        run: |
          # Dedicated DB so the schema-sync snapshots above are untouched.
          PGPASSWORD=ace psql -h 127.0.0.1 -U ace -d postgres -c \
            "DROP DATABASE IF EXISTS ace_upgrade_check;" >/dev/null
          PGPASSWORD=ace psql -h 127.0.0.1 -U ace -d postgres -c \
            "CREATE DATABASE ace_upgrade_check;" >/dev/null
          # Pin the URL on the Alembic config directly; migrations/env.py honors
          # a caller-set sqlalchemy.url over the project's configured DB.
          python -c "
          from alembic.config import Config
          from alembic import command
          cfg = Config('alembic.ini')
          cfg.set_main_option('sqlalchemy.url', '$UPGRADE_DATABASE_URL')
          command.upgrade(cfg, 'head')
          print('alembic upgrade head OK on throwaway DB')
          "
